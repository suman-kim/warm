name: movo_ui
description: "MOVO 앱 공용 화면 — 디자인 시스템과, 고객 앱·기사 앱이 함께 쓰는 화면."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  kakao_map_sdk: ^1.3.1
  movo_api:
    path: ../movo_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0
  movo_testkit:
    path: ../movo_testkit

flutter:
  fonts:
    # SUIT (SIL Open Font License 1.1 — fonts/LICENSE)
    - family: SUIT
      fonts:
        - asset: fonts/SUIT-Regular.otf
          weight: 400
        - asset: fonts/SUIT-Medium.otf
          weight: 500
        - asset: fonts/SUIT-SemiBold.otf
          weight: 600
        - asset: fonts/SUIT-Bold.otf
          weight: 700
        - asset: fonts/SUIT-ExtraBold.otf
          weight: 800
        - asset: fonts/SUIT-Heavy.otf
          weight: 900
