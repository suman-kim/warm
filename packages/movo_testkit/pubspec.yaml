name: movo_testkit
description: "MOVO 앱 테스트 도구 — 가짜 서버, 화면 띄우기, 화면 사진 찍기. 앱의 dev_dependencies로만 쓴다."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  http: ^1.6.0
  movo_api:
    path: ../movo_api
  movo_ui:
    path: ../movo_ui

dev_dependencies:
  flutter_lints: ^6.0.0
